<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#3f291f">

    <title>Sin conexión - Dulce Antojo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f6efe5;
            color: #3f291f;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .offline-card {
            width: min(420px, 100%);
            padding: 40px 25px;
            background: #fffdf9;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(63, 41, 31, 0.12);
        }

        .offline-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #806f61;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            background: #3f291f;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="offline-card">

        <div class="offline-icon">
            🍰
        </div>

        <h1>Sin conexión</h1>

        <p>
            Parece que no tienes conexión a Internet.
            Cuando recuperes la conexión podrás volver
            a disfrutar de Dulce Antojo.
        </p>

        <button onclick="location.reload()">
            Intentar nuevamente
        </button>

    </div>

</body>
</html>
